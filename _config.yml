# SITE CONFIGURATION
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://help.league2go.com" # the base hostname & protocol for your site
#url: "http://localhost:4000" # the base hostname & protocol for your site
permalink: /:title/

appStoreUrls:
    fr:
      iosUrl: 'https://apps.apple.com/ca/app/league2go/id1186556911'
      androidUrl: 'https://play.google.com/store/apps/details?id=ca.maligue&hl=fr&gl=CA'
    en:
      iosUrl: 'https://apps.apple.com/ca/app/league2go/id1186556911'
      androidUrl: 'https://play.google.com/store/apps/details?id=ca.maligue&hl=en&gl=CA'

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Working documents, never published
exclude:
  - ARTICLE-BRIEF.md
  - help-center-analysis.md
  - Gemfile
  - Gemfile.lock
  - README.md

collections:
  help:
    output: true
    permalink: /:title/

defaults:
  -
    scope:
      path: ""
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "help"
    values:
      layout: "article"

# THEME-SPECIFIC CONFIGURATION
theme_settings:
  # Meta
  title: League2GO Help Center
  avatar: avatar.png
  gravatar: # Email MD5 hash
  description: "League2GO help center — everything you need to run your sports league." # used by search engines

  # Header and footer text
  header_text:
  header_text_feature_image: assets/img/header.png

  # Icons
  rss: false
  email_address: # Full email address, e.g. "sam@example.com"
  behance:
  bitbucket:
  dribbble:
  facebook: league2goAPP/
  flickr:
  github:
  google_plus:
  instagram:
  linkedin:  # Full URL
  pinterest:
  reddit:
  soundcloud:
  stack_exchange:  # Full URL
  steam:
  tumblr:
  twitter:
  wordpress:
  youtube:

  # Scripts
  google_analytics: # Tracking ID, e.g. "UA-000000-01"
  disqus_shortname:
  katex: false # Enable if using math markup

  # Localization strings
  str_follow_on: "Follow on"
  str_rss_follow: "Follow RSS feed"
  str_email: "Email"

  # Colours, typography and padding
  # Open the "_sass > base" folder, and open "_variables.scss"
  google_fonts: "Source+Sans+Pro:400,700,700italic,400italic"

  # Post navigation (unused by the help center layout)
  post_navigation: false

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: :compressed

languages:
  en: English
  fr: Français

# Help center categories, in display order. Labels live under t: below.
help_categories:
  - key: getting-started
  - key: managers
  - key: substitutes
  - key: payments
  - key: players

t:
  en:
    header:
    footer: "© League2GO"
    help_center: Help Center
    hero_title: How can we help?
    open_app: Open League2GO
    search_button: Search
    search_input: Search the help center...
    screenshot_placeholder: Screenshot coming soon
    categories:
      getting-started: Getting started
      managers: Managing your league
      substitutes: Substitute search
      payments: Online payments
      players: For players
  fr:
    header:
    footer: "© League2GO"
    help_center: Centre d'aide
    hero_title: Comment pouvons-nous vous aider ?
    open_app: Ouvrir League2GO
    search_button: Rechercher
    search_input: Rechercher dans le centre d'aide...
    screenshot_placeholder: Capture d'écran à venir
    categories:
      getting-started: Premiers pas
      managers: Gérer votre ligue
      substitutes: Recherche de remplaçants
      payments: Paiements en ligne
      players: Pour les joueurs
