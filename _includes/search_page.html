<div class="help-hero">
  <span class="eyebrow">League2GO</span>
  <h1>{{ site.t[page.lang].hero_title }}</h1>
  {% include search_box.html %}
</div>

<div class="search-page">
  <div id="search-results"></div>
</div>

<script>
  window.store = {
  {% for article in site.help %}
  "{{ article.url | slugify }}": {
    "title": "{{ article.title | xml_escape }}",
      "author": "",
      "category": "{{ article.category | xml_escape }}",
      "content": {{ article.content | strip_html | strip_newlines | jsonify }},
    "url": "{{ article.url | xml_escape }}",
    "lang": "{{ article.lang | xml_escape }}"
  }
  {% unless forloop.last %},{% endunless %}
  {% endfor %}
  };
</script>
<script src="/js/lunr.js"></script>
<script src="/js/search.js"></script>
