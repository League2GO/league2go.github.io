---
layout: default
---
<article class="help-article">
  <div class="container-narrow">
    <header>
      <span class="eyebrow">
        <a href="{{ site.baseurl }}/{{ page.lang }}">{{ site.t[page.lang].help_center }}</a>
        &rsaquo; {{ site.t[page.lang].categories[page.category] }}
      </span>
      <h1>{{ page.title }}</h1>
    </header>
    <section class="article-content">{{ content }}</section>
  </div>
</article>
