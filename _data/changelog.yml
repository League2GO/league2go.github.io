# What's new, rendered by _includes/changelog.html on /en/whats-new/ and
# /fr/nouveautes/. Newest week first; add a new week at the top.
#
# Each entry has:
#   audience: managers, players or everyone (labels live under t.<lang>.whats_new.audiences in _config.yml)
#   help:     optional localization key of a help article, linked in the page's language
#   en / fr:  title and body (Markdown) for each language
#
# French copy: vous, no space before ? ! : ; or $, straight apostrophes.

- week: 2026-10-19
  entries:
    - audience: everyone
      help: messaging
      en:
        title: "See your unread chat messages"
        body: "On a phone, the ☰ menu button now adds your unread chat messages to its count, and each league's **Chat** row in the menu shows its own count. In the chat, the list of league and team conversations shows the count of each one. A count clears as soon as you read the messages."
      fr:
        title: "Voyez vos messages de chat non lus"
        body: "Sur un téléphone, le bouton du menu ☰ ajoute maintenant vos messages de chat non lus à son compteur, et la ligne **Chat** de chaque ligue dans le menu affiche son propre compteur. Dans le chat, la liste des discussions de la ligue et des équipes affiche le compteur de chacune. Un compteur s'efface dès que vous lisez les messages."

    - audience: everyone
      help: game-day
      en:
        title: "Player count and home or away on each team"
        body: "On the game page and in the lineup editor, each team's name is now followed by its number of players coming, such as **Whites · 10 players**. In the editor, the count follows your moves. Outside pick-up leagues, each team is also marked **Away team** or **Home team**."
      fr:
        title: "Le nombre de joueurs, et visiteur ou local, pour chaque équipe"
        body: "Sur la page de la partie et dans l'éditeur d'alignement, le nom de chaque équipe est maintenant suivi de son nombre de joueurs présents, par exemple **Blancs · 10 joueurs**. Dans l'éditeur, le nombre suit vos déplacements. Hors des ligues pick-up, chaque équipe est aussi identifiée **Visiteur** ou **Local**."

    - audience: players
      help: results-standings-statistics
      en:
        title: "Your stats from the menu"
        body: "On a phone, the ☰ menu now has a **My stats** row, right after **Statistics**, under each league where you play and players' stats are shown. It opens your own stats page."
      fr:
        title: "Vos statistiques à partir du menu"
        body: "Sur un téléphone, le menu ☰ a maintenant une ligne **Mes stats**, juste après **Statistiques**, sous chaque ligue où vous jouez et qui affiche les statistiques des joueurs. Elle ouvre votre propre page de statistiques."

    - audience: players
      help: divisions
      en:
        title: "Standings open on your division"
        body: "When you play in only one division, **Standings** now opens on that division. Pick **All divisions** to see the others."
      fr:
        title: "Le classement s'ouvre sur votre division"
        body: "Quand vous jouez dans une seule division, **Classement** s'ouvre maintenant sur cette division. Choisissez **Toutes les divisions** pour voir les autres."

    - audience: managers
      help: league-website
      en:
        title: "Open your public site from the menu"
        body: "In your league's menu, the **Web site** row still opens the site editor, and a new ↗ **View site** button beside it opens your public site in a new tab."
      fr:
        title: "Ouvrir votre site public à partir du menu"
        body: "Dans le menu de votre ligue, la ligne **Site web** ouvre toujours l'éditeur du site, et un nouveau bouton ↗ **Voir le site** à côté ouvre votre site public dans un nouvel onglet."

- week: 2026-10-12
  entries:
    - audience: everyone
      help: schedule-and-calendar
      en:
        title: "Previous games stay in the season"
        body: "On a league's schedule, **Show previous games** now shows the earlier games of the season on screen first. Tap it again to open the season before."
      fr:
        title: "Les parties précédentes restent dans la saison"
        body: "Dans l'horaire d'une ligue, **Voir les parties précédentes** affiche maintenant d'abord les parties précédentes de la saison affichée. Touchez-le de nouveau pour ouvrir la saison d'avant."

    - audience: managers
      help: game-day
      en:
        title: "Substitutes easier to read on phones"
        body: "On a phone, **View substitutes** now opens full screen. Each substitute's name, status and positions stay readable, with a compact **Send** button on the right."
      fr:
        title: "Les remplaçants plus faciles à lire sur téléphone"
        body: "Sur un téléphone, **Voir les remplaçants** s'ouvre maintenant en plein écran. Le nom, le statut et les positions de chaque remplaçant restent lisibles, avec un bouton **Envoyer** compact à droite."

    - audience: managers
      help: substitutes-overview
      en:
        title: "Know when substitute requests go out"
        body: "On the game page, an empty spot waiting for its substitute search now says when requests will go out automatically, with the date and time, or that none go out before the game. Its button opens **View substitutes**, where you can send requests right away."
      fr:
        title: "Savoir quand partent les demandes aux remplaçants"
        body: "Sur la page de la partie, une place libre en attente de sa recherche de remplaçants indique maintenant quand les demandes seront envoyées automatiquement, avec la date et l'heure, ou qu'aucune ne part avant la partie. Son bouton ouvre **Voir les remplaçants**, où vous pouvez envoyer des demandes tout de suite."

    - audience: managers
      help: youth-leagues
      en:
        title: "A more compact youth roster"
        body: "In youth leagues, each player on a team's roster in **Teams** now shows one contact line: the first parent's name, followed by a count such as **+2** for the others. Click it to see every parent's details."
      fr:
        title: "Un alignement plus compact dans les ligues mineures"
        body: "Dans les ligues mineures, chaque joueur de l'alignement d'une équipe dans **Équipes** affiche maintenant une seule ligne de contact: le nom du premier parent, suivi d'un nombre comme **+2** pour les autres. Cliquez dessus pour voir les coordonnées de tous les parents."

    - audience: managers
      help: game-day
      en:
        title: "Lineup printing and substitute moves fixed"
        body: "**Print Lineup** in the **Game menu** prints a full-size sheet again. A substitute moved between **Teams** and **Substitutes** now shows up in the right place on both screens right away."
      fr:
        title: "Impression de l'alignement et déplacements de remplaçants corrigés"
        body: "**Imprimer l'alignement** dans le **Menu de la partie** imprime de nouveau une feuille pleine grandeur. Un remplaçant déplacé entre **Équipes** et **Remplaçants** apparaît maintenant tout de suite au bon endroit dans les deux écrans."

- week: 2026-10-05
  entries:
    - audience: everyone
      help: results-standings-statistics
      en:
        title: "Standings columns in the usual order"
        body: "Team standings now list wins, losses, ties and overtime losses in that order, the way hockey standings are usually shown, in the app and on your league's public site."
      fr:
        title: "Les colonnes du classement dans l'ordre habituel"
        body: "Le classement des équipes présente maintenant les victoires, les défaites, les parties nulles et les défaites en prolongation dans cet ordre, comme les classements de hockey habituels, dans l'application et sur le site public de votre ligue."

    - audience: everyone
      help: results-standings-statistics
      en:
        title: "A season with no results yet says so"
        body: "When no score has been entered yet this season, **Statistics** and **Standings** now say so, with buttons to see last season or **All seasons**. **Statistics** also always opens on the season under way."
      fr:
        title: "Une saison encore sans résultats l'indique"
        body: "Quand aucun pointage n'a encore été entré pour la saison, **Statistiques** et **Classement** l'indiquent maintenant, avec des boutons pour voir la saison précédente ou **Toutes les saisons**. **Statistiques** s'ouvre aussi toujours sur la saison en cours."

    - audience: everyone
      en:
        title: "Easier-to-read text"
        body: "Grey text is darker, the dates on the schedule are bigger, and the smallest text is larger. On the game page, the time is now as large as the date."
      fr:
        title: "Un texte plus facile à lire"
        body: "Le texte gris est plus foncé, les dates de l'horaire sont plus grandes et le plus petit texte a grossi. Sur la page de la partie, l'heure est maintenant aussi grande que la date."

    - audience: managers
      help: results-standings-statistics
      en:
        title: "Clearer goal entry"
        body: "In the results editor on a phone, each goal without details now has its own row with an **Add details** button. In a game with a single period, the − and + beside each team change its score directly."
      fr:
        title: "Une entrée des buts plus claire"
        body: "Dans l'éditeur de résultats sur un téléphone, chaque but sans détails a maintenant sa propre ligne avec un bouton **Ajouter les détails**. Dans une partie d'une seule période, les boutons − et + à côté de chaque équipe changent directement son pointage."

    - audience: managers
      help: substitute-search-settings
      en:
        title: "Clearer player rankings"
        body: "On the game page, a substitute with no ranking at their spot's position now shows a question mark (**?**) and no longer counts in the team average. In leagues ranked by letter, each position lists the best ranking first. In the substitute settings, each skill range shows its values above its slider."
      fr:
        title: "Des forces de joueurs plus claires"
        body: "Sur la page de la partie, un remplaçant sans force à la position de sa place affiche maintenant un point d'interrogation (**?**) et ne compte plus dans la moyenne de l'équipe. Dans les ligues classées par lettre, chaque position présente la meilleure force en premier. Dans les paramètres des remplaçants, chaque plage de forces affiche ses valeurs au-dessus de son curseur."

- week: 2026-09-28
  entries:
    - audience: everyone
      en:
        title: "A new menu"
        body: "The ☰ menu lists each of your leagues with its pages underneath: Schedule, Standings, Stats, Chat and more."
      fr:
        title: "Un nouveau menu"
        body: "Le menu ☰ présente chacune de vos ligues avec ses pages en dessous: Horaire, Classement, Statistiques, Chat et plus encore."

    - audience: everyone
      en:
        title: "A back button on every page"
        body: "On a phone, every page now has a back button at the top that says where it takes you, even when you came from a notification."
      fr:
        title: "Un bouton de retour sur chaque page"
        body: "Sur un téléphone, chaque page a maintenant un bouton de retour en haut qui indique où il mène, même si vous arrivez d'une notification."

    - audience: everyone
      help: results-standings-statistics
      en:
        title: "Standings and stats, each on its own page"
        body: "Standings and statistics now each have their own page. The tables have a single row of filters, show every column on phones, and rank players by points."
      fr:
        title: "Le classement et les statistiques, chacun sa page"
        body: "Le classement et les statistiques ont maintenant chacun leur page. Les tableaux ont une seule rangée de filtres, affichent toutes les colonnes sur téléphone et classent les joueurs par points."

    - audience: managers
      en:
        title: "More direct links to your league's screens"
        body: "On a phone, the bar at the bottom of your league opens **Teams**, **Substitutes**, **Season**, **More** and **Settings** in one tap. **Season** holds the calendar, the standings and the stats."
      fr:
        title: "Des liens plus directs vers les écrans de votre ligue"
        body: "Sur un téléphone, la barre au bas de votre ligue ouvre **Équipes**, **Remplaçants**, **Saison**, **Plus** et **Paramètres** en un seul clic. **Saison** regroupe le calendrier, le classement et les statistiques."

    - audience: players
      en:
        title: "Captains can see their substitutes"
        body: "Captains now have a **Substitutes** screen with the substitutes of the teams they captain."
      fr:
        title: "Les capitaines voient leurs remplaçants"
        body: "Les capitaines ont maintenant un écran **Remplaçants** avec les remplaçants des équipes dont ils sont capitaines."

    - audience: players
      help: player-guide
      en:
        title: "An improved schedule"
        body: "Games now show in bigger cards that are easier to read. Your next game stands out, so you can answer **Are you playing?** in one tap."
      fr:
        title: "Un horaire amélioré"
        body: "Les parties s'affichent maintenant dans de plus grandes cartes, plus faciles à lire. Votre prochaine partie ressort, pour répondre à **Serez-vous présent?** en un seul clic."

    - audience: managers
      help: game-day
      en:
        title: "Fill a spot faster"
        body: "On the game page, an empty spot now leads with **Select player**. The list opens on the spot's team, then the substitutes, with the search ready to type in."
      fr:
        title: "Remplir une place plus vite"
        body: "Sur la page de la partie, une place libre offre maintenant **Sélectionner un joueur** en premier. La liste s'ouvre sur l'équipe de la place, puis les remplaçants, avec la recherche prête."

    - audience: managers
      help: results-standings-statistics
      en:
        title: "Faster results entry"
        body: "In the results editor, type a player's name or jersey number to pick the scorer, the assists or a penalty. Leagues that record goal details can type the score again, without adding the goals one by one."
      fr:
        title: "Entrée des résultats plus rapide"
        body: "Dans l'éditeur de résultats, tapez le nom ou le numéro de chandail d'un joueur pour choisir le marqueur, les passes ou une punition. Les ligues qui compilent le détail des buts peuvent de nouveau taper le pointage, sans ajouter les buts un à un."

    - audience: managers
      help: schedule-and-calendar
      en:
        title: "Edit or reschedule a game from its page"
        body: "The game page's **Game menu** now starts with **Edit game** and **Reschedule**, so you no longer need to go back to the league schedule."
      fr:
        title: "Modifier ou déplacer une partie à partir de sa page"
        body: "Le **Menu de la partie** commence maintenant par **Modifier la partie** et **Déplacer**: plus besoin de retourner à l'horaire de la ligue."

    - audience: managers
      help: game-day
      en:
        title: "A player's phone and email on the game page"
        body: "On the game page, a player's menu now shows their phone, email and emergency contacts. Captains and scorekeepers see them too."
      fr:
        title: "Le téléphone et le courriel d'un joueur sur la page de la partie"
        body: "Sur la page de la partie, le menu d'un joueur affiche maintenant son téléphone, son courriel et ses contacts d'urgence. Les capitaines et les marqueurs y ont aussi accès."

    - audience: managers
      help: managing-substitutes
      en:
        title: "Substitutes' skill levels are back"
        body: "**View substitutes** shows each substitute's skill level again. In leagues with numeric rankings, the filter takes any value."
      fr:
        title: "Le niveau des remplaçants est de retour"
        body: "**Voir les remplaçants** affiche de nouveau le niveau de chaque remplaçant. Dans les ligues à classement numérique, le filtre accepte n'importe quelle valeur."

    - audience: everyone
      en:
        title: "See who's coming at a glance"
        body: "On the game page, a player who dropped out stays struck out on their spot, and the position headers count only the players who are coming. Tapping a game on the schedule now opens the game."
      fr:
        title: "Voir qui sera présent en un coup d'œil"
        body: "Sur la page de la partie, un joueur absent reste affiché, barré, sur sa place, et les en-têtes de position comptent seulement les joueurs présents. Toucher une partie dans l'horaire ouvre maintenant la partie."

    - audience: managers
      help: game-day
      en:
        title: "The lineup editor remembers your lineup type"
        body: "The lineup editor now opens on the lineup type you used last."
      fr:
        title: "L'éditeur d'alignement se souvient de votre type d'alignement"
        body: "L'éditeur d'alignement s'ouvre maintenant sur le type d'alignement utilisé la dernière fois."

    - audience: players
      en:
        title: "Substitution requests you can trust"
        body: "Your substitution requests now list only the spots you can still take. If another substitute takes a spot before you, the request stays on your schedule for a day, marked **Spot already taken**."
      fr:
        title: "Des demandes de remplacement toujours à jour"
        body: "Vos demandes de remplacement montrent maintenant seulement les places que vous pouvez encore prendre. Si un autre remplaçant prend la place avant vous, la demande reste affichée une journée avec la mention **Place déjà prise**."

    - audience: players
      en:
        title: "A schedule for substitutes"
        body: "A substitute who isn't on any team in a league now sees their own games on the league's schedule, with the league's full schedule one tap away."
      fr:
        title: "L'horaire des remplaçants"
        body: "Un remplaçant qui ne fait partie d'aucune équipe d'une ligue voit maintenant ses propres parties dans l'horaire de la ligue, et l'horaire complet de la ligue est à un seul clic."

    - audience: managers
      help: game-day
      en:
        title: "Move a player to the other team in one tap"
        body: "In the lineup editor, an arrow on each player sends them to the other team, no dragging needed. Handy on a phone."
      fr:
        title: "Changer un joueur d'équipe en un seul clic"
        body: "Dans l'éditeur d'alignement, une flèche sur chaque joueur l'envoie dans l'autre équipe, sans glisser-déposer. Pratique sur un téléphone."

    - audience: everyone
      en:
        title: "Easier-to-read jersey numbers"
        body: "On a phone, jersey numbers now read clearly on every team colour, even yellow and white. On the game page, an absent player also keeps their number next to their struck-out name."
      fr:
        title: "Des numéros de chandail plus lisibles"
        body: "Sur un téléphone, le numéro de chandail se lit maintenant sur toutes les couleurs d'équipe, même le jaune et le blanc. Sur la page de la partie, un joueur absent garde aussi son numéro à côté de son nom barré."

    - audience: everyone
      en:
        title: "Played games open on their results"
        body: "On your league's public site, tapping a game that has been played now opens its results, as in the app."
      fr:
        title: "Les parties jouées s'ouvrent sur leurs résultats"
        body: "Sur le site public de votre ligue, toucher une partie déjà jouée ouvre maintenant ses résultats, comme dans l'application."

    - audience: managers
      en:
        title: "Edit a season in one tap"
        body: "In your league's seasons, tapping a season now opens it for editing."
      fr:
        title: "Modifier une saison en un seul clic"
        body: "Dans les saisons de votre ligue, toucher une saison l'ouvre maintenant pour la modifier."

- week: 2026-09-21
  entries:
    - audience: everyone
      help: schedule-and-calendar
      en:
        title: "See which games still need a substitute"
        body: "An upcoming game that is still short a player now carries a red **Substitute needed** label on the schedules and in the calendar."
      fr:
        title: "Voyez quelles parties cherchent encore un remplaçant"
        body: "Une partie à venir à qui il manque encore un joueur porte maintenant l'étiquette rouge **Remplaçant recherché** dans les horaires et le calendrier."

    - audience: managers
      help: managing-substitutes
      en:
        title: "Add a substitute with just a name"
        body: "When you add a substitute to a game, the email and phone number are optional again: a name is enough."
      fr:
        title: "Ajouter un remplaçant avec seulement son nom"
        body: "Quand vous ajoutez un remplaçant à une partie, le courriel et le numéro de téléphone sont de nouveau facultatifs: un nom suffit."

    - audience: managers
      en:
        title: "Search the team and division lists"
        body: "The team lists of the game form, and the division and team filters, now have a search field. Teams are sorted by name."
      fr:
        title: "Recherche dans les listes d'équipes et de divisions"
        body: "Les listes d'équipes du formulaire de partie, ainsi que les filtres de division et d'équipe, ont maintenant un champ de recherche. Les équipes sont triées par nom."

    - audience: managers
      help: game-day
      en:
        title: "3 on 3 and 4 on 4 hockey lineups"
        body: "The lineup editor offers two new hockey formations, 3 on 3 and 4 on 4, next to 5 on 5, for leagues that play on small ice."
      fr:
        title: "Alignements de hockey à 3 contre 3 et 4 contre 4"
        body: "L'éditeur d'alignement offre deux nouvelles formations de hockey, 3 contre 3 et 4 contre 4, à côté du 5 contre 5, pour les ligues qui jouent sur petite glace."

    - audience: everyone
      en:
        title: "Redesigned emails"
        body: "Every email from the app has a new, easier to read design and its own subject line. Replying to a substitution request now reaches the team's captain or the league manager."
      fr:
        title: "Des courriels redessinés"
        body: "Tous les courriels de l'application ont une nouvelle présentation plus facile à lire et leur propre objet. Répondre à une demande de remplacement rejoint maintenant le capitaine de l'équipe ou le gestionnaire de la ligue."

- week: 2026-09-14
  entries:
    - audience: managers
      help: game-day
      en:
        title: "A printed lineup that fits one page"
        body: "The printed lineup fits on one Letter page again, with a team on each half."
      fr:
        title: "Un alignement imprimé qui tient sur une page"
        body: "L'alignement imprimé tient de nouveau sur une page Lettre, avec une équipe sur chaque moitié."

    - audience: managers
      en:
        title: "Substitute payments at a glance"
        body: "On the game lineup, a substitute's payment is now a badge after their name: green **Paid**, or orange with the amount owed."
      fr:
        title: "Les paiements des remplaçants en un coup d'œil"
        body: "Dans l'alignement de la partie, le paiement d'un remplaçant est maintenant une pastille après son nom: **Payé** en vert, ou en orange avec le montant dû."
